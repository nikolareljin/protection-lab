# Test: can CI move the production tag with GITHUB_TOKEN? Refused while the
# "production tag moves" ruleset exists; allowed under ci_moves_production.
name: move-production
on: workflow_dispatch
permissions:
  contents: write
jobs:
  with-github-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name ci && git config user.email ci@example.com
          git commit --allow-empty -m "token move $GITHUB_RUN_ID"
          git tag -f production
          git push -f origin refs/tags/production
